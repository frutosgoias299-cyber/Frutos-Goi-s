<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutos de Goiás | Cardápio Digital</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Liga ao CSS do Cardápio (atualizado para v=2 para limpar cache) -->
    <link rel="stylesheet" href="css/app.css?v=2">
</head>

<body>

    <!-- CABEÇALHO PREMIUM -->
    <header class="app-header">
        <div class="logo-container">
            <h1 class="logo-texto">FRUTOS DE GOIÁS</h1>
        </div>
        <div class="badge-delivery">
            <span>🚀 Delivery</span>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="app-conteudo">
        
        <!-- Barra de Categorias Horizontal -->
        <div class="categorias-scroll">
            <button class="categoria-btn ativo">Todos</button>
            <button class="categoria-btn">Picolés</button>
            <button class="categoria-btn">Gelados</button>
            <button class="categoria-btn">Açaí</button>
            <button class="categoria-btn">Especiais</button>
        </div>

        <h2 class="titulo-seccao">Destaques</h2>

        <!-- GRELHA DE PRODUTOS PREMIUM -->
        <div class="grelha-produtos">
            
            <!-- Produto 1 -->
            <div class="produto-card">
                <div class="produto-imagem">
                    <span class="icone-temp">🥝</span>
                </div>
                <div class="produto-info">
                    <h3 class="produto-titulo">Picolé de Kiwi</h3>
                    <p class="produto-desc">100% fruta natural</p>
                    <div class="produto-rodape">
                        <span class="produto-preco">R$ 6,00</span>
                        <button class="btn-adicionar" title="Adicionar">+</button>
                    </div>
                </div>
            </div>

            <!-- Produto 2 -->
            <div class="produto-card">
                <div class="produto-imagem">
                    <span class="icone-temp">🍓</span>
                </div>
                <div class="produto-info">
                    <h3 class="produto-titulo">Gelado Morango</h3>
                    <p class="produto-desc">Copo artesanal 300ml</p>
                    <div class="produto-rodape">
                        <span class="produto-preco">R$ 14,00</span>
                        <button class="btn-adicionar" title="Adicionar">+</button>
                    </div>
                </div>
            </div>

            <!-- Produto 3 -->
            <div class="produto-card">
                <div class="produto-imagem">
                    <span class="icone-temp">🫐</span>
                </div>
                <div class="produto-info">
                    <h3 class="produto-titulo">Açaí Tradicional</h3>
                    <p class="produto-desc">Tigela 500ml + granola</p>
                    <div class="produto-rodape">
                        <span class="produto-preco">R$ 22,00</span>
                        <button class="btn-adicionar" title="Adicionar">+</button>
                    </div>
                </div>
            </div>

            <!-- Produto 4 -->
            <div class="produto-card">
                <div class="produto-imagem">
                    <span class="icone-temp">🥭</span>
                </div>
                <div class="produto-info">
                    <h3 class="produto-titulo">Picolé de Manga</h3>
                    <p class="produto-desc">Sem adição de açúcares</p>
                    <div class="produto-rodape">
                        <span class="produto-preco">R$ 6,00</span>
                        <button class="btn-adicionar" title="Adicionar">+</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR ESTILO APP NATIVA -->
    <nav class="bottom-bar">
        <a href="app.html" class="nav-item ativo">
            <span class="icone">🏠</span>
            <span>Início</span>
        </a>
        <a href="#" class="nav-item">
            <span class="icone">📜</span>
            <span>Cardápio</span>
        </a>
        <a href="leitor.html" class="nav-item">
            <span class="icone">📷</span>
            <span>Ler QR</span>
        </a>
        <a href="carrinho.html" class="nav-item">
            <span class="icone">🛒</span>
            <span>Carrinho</span>
        </a>
    </nav>
<!-- Liga ao JavaScript do cardápio -->
    <script src="js/app.js"></script>
</body>
</html>
