<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutos de Goiás | Experiência</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Liga ao teu CSS (v=6 para limpar a cache) -->
    <link rel="stylesheet" href="css/style.css?v=6">
    <!-- Scripts do GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

    <!-- CAMADA 1: A Tela de Fotos (Substitui o vídeo pesado) -->
    <div class="video-container">
        <canvas id="tela-gelado"></canvas>
    </div>

    <!-- BOTÃO EXPLORAR (Auto-scroll para guiar o cliente) -->
    <div id="btn-explorar" onclick="descerAutomaticamente()">
        <span>Explorar</span>
        <div class="seta">↓</div>
    </div>

    <!-- CAMADA 3: Textos e Interação -->
    <main>
        <!-- 1. SECÇÃO FANTASMA (Para gastar a animação inicial do canvas) -->
        <section style="height: 180vh; pointer-events: none;"></section>

        <!-- 2. TELA INICIAL -->
        <section class="seccao-vidro">
            <h1 class="texto-impacto">FRUTOS DE GOIÁS</h1>
            <p class="subtitulo">A experiência</p>
        </section>

        <!-- 3. TEXTOS NO MEIO DO CAMINHO -->
        <section class="seccao-sabor">
            <div class="conteudo-esquerdo">
                <h2 class="sabor-texto verde">SINTA O SABOR</h2>
                <h2 class="sabor-texto branco">DA NATUREZA</h2>
            </div>
        </section>

        <!-- 4. MAIS TEXTOS NO MEIO DO CAMINHO -->
        <section class="seccao-sabor">
            <div class="conteudo-direito">
                <h2 class="sabor-texto verde">100%</h2>
                <h2 class="sabor-texto branco">ARTESANAL</h2>
            </div>
        </section>

        <!-- 5. TELA FINAL -->
        <section class="seccao-sabor seccao-final">
            <div class="conteudo-centro">
                <h2 class="sabor-texto verde">ENERGIA</h2>
                <h2 class="sabor-texto branco">TROPICAL</h2>
                
                <a href="cardapio.html" class="botao-neon sabor-texto">PEDIR AGORA</a>

                <!-- Link do Admin com margem segura -->
                <div style="margin-top: 50px; padding-bottom: 20px;">
                    <a href="admin.html" style="color: #555; font-size: 0.8rem; text-decoration: none; font-family: 'Inter', sans-serif; letter-spacing: 1px;">
                        ⚙️ PAINEL DO DONO
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Estilo do botão Explorar e ajustes visuais -->
    <style>
        #btn-explorar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            text-align: center;
            color: var(--cor-verde, #00FF66);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            cursor: pointer;
            animation: saltitar 2s infinite;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.9);
            -webkit-tap-highlight-color: transparent;
        }
        #btn-explorar .seta {
            font-size: 2rem;
            margin-top: -5px;
        }
        @keyframes saltitar {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, 12px); }
        }
    </style>

    <!-- Script para descer a tela suavemente -->
    <script>
        function descerAutomaticamente() {
            window.scrollBy({
                top: window.innerHeight * 1.5,
                behavior: 'smooth'
            });
            document.getElementById('btn-explorar').style.display = 'none';
        }
    </script>

    <!-- Liga ao teu JavaScript principal -->
    <script src="js/main.js"></script>
</body>

</html>
