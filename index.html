<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutos de Goiás | Experiência</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Liga ao teu CSS -->
    <!-- Coloquei ?v=5 aqui para limpar a cache do teu telemóvel na hora -->
    <link rel="stylesheet" href="css/style.css?v=5">
    <!-- Scripts do GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body>

    <!-- CAMADA 1: A Tela de Fotos (Substitui o vídeo pesado) -->
    <div class="video-container">
        <canvas id="tela-gelado"></canvas>
    </div>

    <!-- CAMADA 2: O Vidro Quebrado -->
    <img id="vidro-quebrado" src="vidro.jpeg" alt="Vidro Quebrado">

    <!-- CAMADA 3: Textos e Interação -->
    <main>
        <!-- 1. SECÇÃO FANTASMA (Adicionada ao TOPO para gastar a animação branca do vidro) -->
        <section style="height: 180vh; pointer-events: none;"></section>

        <!-- 2. TELA INICIAL (O texto entra apenas depois do scroll passar a secção fantasma) -->
        <section class="seccao-vidro">
            <h1 class="texto-impacto">FRUTOS DE GOIÁS</h1>
            <p class="subtitulo">A experiência</p>
        </section>

        <!-- 3. TEXTOS NO MEIO DO CAMINHO -->
        <section class="seccao-sabor">
            <div class="conteudo-esquerdo">
                <h2 class="sabor-texto verde">SINTA O SABOR</h2>
                <h2 class="sabor-texto branco">DA NATUREZA</h2>
            </div>
        </section>

        <!-- 4. MAIS TEXTOS NO MEIO DO CAMINHO -->
        <section class="seccao-sabor">
            <div class="conteudo-direito">
                <h2 class="sabor-texto verde">100%</h2>
                <h2 class="sabor-texto branco">ARTESANAL</h2>
            </div>
        </section>

        <!-- 5. TELA FINAL (Aparece quando o scroll bate no fundo) -->
        <section class="seccao-sabor seccao-final">
            <div class="conteudo-centro">
                <h2 class="sabor-texto verde">ENERGIA</h2>
                <h2 class="sabor-texto branco">TROPICAL</h2>
                <a href="app.html" class="botao-neon sabor-texto">PEDIR AGORA</a>
            </div>
        </section>
    </main>
    <!-- Liga ao teu JavaScript -->
    <script src="js/main.js"></script>
</body>

</html>
