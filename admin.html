<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão | Frutos de Goiás</title>
    <!-- Tipografia Refinada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-principal: #0F1110;
            --bg-cartao: #181A19;
            --bg-input: #121413;
            --destaque-dourado: #E5B369;
            --texto-principal: #FFFFFF;
            --texto-suave: #9E9E9E;
            --borda-fina: rgba(255, 255, 255, 0.08);
            --verde-sucesso: #25D366;
            --vermelho-alerta: #FF4D4D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding: 24px 20px 80px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        /* Topo Executivo */
        .topo-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--borda-fina);
            margin-bottom: 28px;
        }

        .marca-admin h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--texto-principal);
        }

        .marca-admin span {
            font-size: 0.8rem;
            color: var(--destaque-dourado);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-link-cardapio {
            color: var(--texto-suave);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--borda-fina);
            transition: all 0.2s ease;
        }

        .btn-link-cardapio:hover {
            color: var(--texto-principal);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Bloco de Notificação */
        .alerta-feedback {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
        }

        .alerta-sucesso {
            background: rgba(37, 211, 102, 0.1);
            color: var(--verde-sucesso);
            border: 1px solid rgba(37, 211, 102, 0.25);
        }

        .alerta-erro {
            background: rgba(255, 77, 77, 0.1);
            color: var(--vermelho-alerta);
            border: 1px solid rgba(255, 77, 77, 0.25);
        }

        /* Painel / Card Base */
        .painel-secao {
            background: var(--bg-cartao);
            border: 1px solid var(--borda-fina);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
        }

        .secao-titulo {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        /* Formulário Elegante */
        .grid-formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .campo-full {
            grid-column: span 2;
        }

        .grupo-input {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grupo-input label {
            font-size: 0.8rem;
            color: var(--texto-suave);
            font-weight: 500;
        }

        .grupo-input input,
        .grupo-input select,
        .grupo-input textarea {
            background: var(--bg-input);
            border: 1px solid var(--borda-fina);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--texto-principal);
            font-family: inherit;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        .grupo-input input:focus,
        .grupo-input select:focus,
        .grupo-input textarea:focus {
            outline: none;
            border-color: var(--destaque-dourado);
        }

        .btn-principal {
            grid-column: span 2;
            background: var(--destaque-dourado);
            color: #111;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 6px;
        }

        .btn-principal:hover {
            opacity: 0.9;
        }

        .btn-principal:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Lista de Itens no Catálogo */
        .lista-produtos {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-linha {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            border: 1px solid var(--borda-fina);
            padding: 14px 16px;
            border-radius: 12px;
            gap: 12px;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-grow: 1;
        }

        .item-nome {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .item-sub {
            font-size: 0.78rem;
            color: var(--texto-suave);
        }

        .item-acoes {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s ease;
        }

        .status-ativo {
            background: rgba(37, 211, 102, 0.12);
            color: var(--verde-sucesso);
        }

        .status-esgotado {
            background: rgba(255, 77, 77, 0.12);
            color: var(--vermelho-alerta);
        }

        .btn-excluir {
            background: transparent;
            border: 1px solid var(--borda-fina);
            color: var(--texto-suave);
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-excluir:hover {
            border-color: var(--vermelho-alerta);
            color: var(--vermelho-alerta);
        }

        .estado-vazio {
            text-align: center;
            color: var(--texto-suave);
            padding: 30px 0;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .grid-formulario {
                grid-template-columns: 1fr;
            }
            .campo-full {
                grid-column: span 1;
            }
            .btn-principal {
                grid-column: span 1;
            }
            .item-linha {
                flex-direction: column;
                align-items: flex-start;
            }
            .item-acoes {
                width: 100%;
                justify-content: space-between;
                margin-top: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header class="topo-admin">
            <div class="marca-admin">
                <h1>Frutos de Goiás</h1>
                <span>Painel de Gestão</span>
            </div>
            <a href="cardapio.html" target="_blank" class="btn-link-cardapio">Visualizar Cardápio ↗</a>
        </header>

        <div id="alerta-feedback" class="alerta-feedback"></div>

        <!-- Seção: Novo Produto -->
        <section class="painel-secao">
            <h2 class="secao-titulo">Cadastrar Produto</h2>
            <form id="form-cadastro" class="grid-formulario">
                
                <div class="grupo-input">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: Picolé Ninho Trufado" required>
                </div>

                <div class="grupo-input">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="picoles">Picolés</option>
                        <option value="gelados">Taças & Gelados</option>
                        <option value="acai">Açaí</option>
                        <option value="especiais">Especiais</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.50" id="preco" placeholder="Ex: 8.50" required>
                </div>

                <div class="grupo-input">
                    <label for="imagem_url">URL da Fotografia</label>
                    <input type="url" id="imagem_url" placeholder="https://exemplo.com/foto.jpg">
                </div>

                <div class="grupo-input campo-full">
                    <label for="descricao">Descrição Breve / Ingredientes</label>
                    <textarea id="descricao" rows="2" placeholder="Ex: 100% fruta natural, sem conservantes..."></textarea>
                </div>

                <button type="submit" id="btn-submit" class="btn-principal">Salvar no Catálogo</button>
            </form>
        </section>

        <!-- Seção: Catálogo Atual -->
        <section class="painel-secao">
            <h2 class="secao-titulo">Itens Ativos no Cardápio</h2>
            <div class="lista-produtos" id="lista-produtos">
                <div class="estado-vazio">A carregar itens do catálogo...</div>
            </div>
        </section>

    </div>

    <script>
        let catalogo = [];

        function emitirFeedback(texto, tipo = 'sucesso') {
            const caixa = document.getElementById('alerta-feedback');
            caixa.innerText = texto;
            caixa.className = `alerta-feedback ${tipo === 'sucesso' ? 'alerta-sucesso' : 'alerta-erro'}`;
            caixa.style.display = 'block';
            setTimeout(() => { caixa.style.display = 'none'; }, 3500);
        }

        // 1. Obter Catálogo
        async function carregarCatalogo() {
            try {
                const res = await fetch('/api/produtos');
                if (!res.ok) throw new Error();
                catalogo = await res.json();
            } catch (err) {
                // Fallback para simulação local caso a API não esteja em execução
                catalogo = JSON.parse(localStorage.getItem('produtos_banco_mock')) || [
                    { id: 1, nome: "Picolé Ninho Trufado", categoria: "picoles", preco: 8.50, descricao: "Cremoso com recheio de avelã", disponivel: true },
                    { id: 2, nome: "Picolé de Maracujá", categoria: "picoles", preco: 6.00, descricao: "100% polpa de fruta natural", disponivel: true },
                    { id: 3, nome: "Taça Suprema de Morango", categoria: "gelados", preco: 24.00, descricao: "Gelado artesanal com calda", disponivel: true }
                ];
            }
            renderizarItens();
        }

        // 2. Renderizar Lista
        function renderizarItens() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';

            if (catalogo.length === 0) {
                container.innerHTML = '<div class="estado-vazio">Nenhum produto cadastrado no catálogo.</div>';
                return;
            }

            catalogo.forEach((item) => {
                const precoFormatado = parseFloat(item.preco).toFixed(2).replace('.', ',');
                const ativo = item.disponivel !== false;

                const linha = document.createElement('div');
                linha.className = 'item-linha';
                linha.innerHTML = `
                    <div class="item-info">
                        <span class="item-nome">${item.nome}</span>
                        <span class="item-sub">${item.categoria.toUpperCase()} • R$ ${precoFormatado}</span>
                    </div>
                    <div class="item-acoes">
                        <button class="badge-status ${ativo ? 'status-ativo' : 'status-esgotado'}" onclick="alternarStatus(${item.id}, ${ativo})">
                            ${ativo ? '● Disponível' : '○ Esgotado'}
                        </button>
                        <button class="btn-excluir" onclick="removerItem(${item.id})">Excluir</button>
                    </div>
                `;
                container.appendChild(linha);
            });
        }

        // 3. Cadastrar Produto
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'A guardar...';

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                categoria: document.getElementById('categoria').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem_url: document.getElementById('imagem_url').value.trim(),
                descricao: document.getElementById('descricao').value.trim()
            };

            try {
                const res = await fetch('/api/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error();
                const novo = await res.json();
                catalogo.push(novo);
                emitirFeedback('Produto adicionado ao catálogo com sucesso!');
            } catch (err) {
                const novoMock = { ...payload, id: Date.now(), disponivel: true };
                catalogo.push(novoMock);
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
                emitirFeedback('Produto guardado localmente!', 'sucesso');
            } finally {
                renderizarItens();
                e.target.reset();
                btn.disabled = false;
                btn.innerText = 'Salvar no Catálogo';
            }
        });

        // 4. Alternar Disponibilidade (Disponível / Esgotado)
        async function alternarStatus(id, statusAtual) {
            const novoStatus = !statusAtual;
            try {
                const res = await fetch('/api/produtos', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, disponivel: novoStatus })
                });
                if (!res.ok) throw new Error();
                const index = catalogo.findIndex(p => p.id === id);
                if (index !== -1) catalogo[index].disponivel = novoStatus;
            } catch (e) {
                const index = catalogo.findIndex(p => p.id === id);
                if (index !== -1) catalogo[index].disponivel = novoStatus;
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
            }
            renderizarItens();
        }

        // 5. Excluir Item
        async function removerItem(id) {
            if (!confirm('Deseja excluir este item do catálogo?')) return;

            try {
                const res = await fetch(`/api/produtos?id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                catalogo = catalogo.filter(p => p.id !== id);
                emitirFeedback('Item removido com sucesso!');
            } catch (e) {
                catalogo = catalogo.filter(p => p.id !== id);
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
                emitirFeedback('Item removido localmente!', 'sucesso');
            }
            renderizarItens();
        }

        document.addEventListener('DOMContentLoaded', carregarCatalogo);
    </script>
</body>
</html>
