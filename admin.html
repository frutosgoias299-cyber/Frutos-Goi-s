<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Frutos de Goiás</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=3">
    <style>
        .admin-layout {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px 80px;
        }

        .card-painel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .formulario-produto {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .campo-full {
            grid-column: span 2;
        }

        .campo-grupo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .campo-grupo label {
            color: #DDD;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .campo-grupo input,
        .campo-grupo select,
        .campo-grupo textarea {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px;
            color: #FFF;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .campo-grupo input:focus,
        .campo-grupo select:focus,
        .campo-grupo textarea:focus {
            outline: none;
            border-color: var(--cor-verde, #00FF66);
        }

        .btn-salvar {
            grid-column: span 2;
            background: var(--cor-verde, #00FF66);
            color: #111;
            font-weight: 700;
            padding: 14px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-salvar:hover {
            opacity: 0.9;
        }

        .btn-salvar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tabela-produtos {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .tabela-produtos th,
        .tabela-produtos td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #EEE;
            font-size: 0.9rem;
        }

        .tabela-produtos th {
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .badge-status {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .status-ativo {
            background: rgba(0, 255, 102, 0.15);
            color: #00FF66;
        }

        .status-inativo {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
        }

        .btn-acao {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }

        .msg-alerta {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            display: none;
        }
        .msg-sucesso {
            background: rgba(0, 255, 102, 0.15);
            color: #00FF66;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
        .msg-erro {
            background: rgba(255, 68, 68, 0.15);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <h1 class="logo-texto">PAINEL DO DONO</h1>
        </div>
        <div class="badge-delivery">
            <span>⚙️ Gerenciamento</span>
        </div>
    </header>

    <main class="admin-layout">
        
        <div id="alerta-status" class="msg-alerta"></div>

        <!-- Formulário de Cadastro -->
        <section class="card-painel">
            <h2 class="titulo-seccao" style="margin-bottom: 16px;">Adicionar Novo Produto</h2>
            <form id="form-produto" class="formulario-produto">
                <div class="campo-grupo">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: Picolé de Ninho Trufado" required>
                </div>

                <div class="campo-grupo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="picoles">Picolés</option>
                        <option value="gelados">Gelados / Taças</option>
                        <option value="acai">Açaí</option>
                        <option value="especiais">Especiais</option>
                    </select>
                </div>

                <div class="campo-grupo">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.50" id="preco" placeholder="Ex: 8.50" required>
                </div>

                <div class="campo-grupo">
                    <label for="imagem_url">URL da Imagem</label>
                    <input type="url" id="imagem_url" placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="campo-grupo campo-full">
                    <label for="descricao">Descrição / Ingredientes</label>
                    <textarea id="descricao" rows="2" placeholder="Ex: Feito com fruta fresca e ingredientes selecionados..."></textarea>
                </div>

                <button type="submit" id="btn-submit-salvar" class="btn-salvar">Cadastrar Produto</button>
            </form>
        </section>

        <!-- Listagem de Produtos Cadastrados -->
        <section class="card-painel">
            <h2 class="titulo-seccao" style="margin-bottom: 16px;">Produtos em Catálogo</h2>
            <div style="overflow-x: auto;">
                <table class="tabela-produtos">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Categoria</th>
                            <th>Preço</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-admin-produtos">
                        <tr>
                            <td colspan="5" style="text-align: center; color: #888;">Carregando produtos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        let catalogo = [];

        function mostrarMensagem(texto, tipo = 'sucesso') {
            const alerta = document.getElementById('alerta-status');
            alerta.innerText = texto;
            alerta.className = `msg-alerta ${tipo === 'sucesso' ? 'msg-sucesso' : 'msg-erro'}`;
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
            }, 4000);
        }

        // 1. Carregar Produtos (GET /api/produtos)
        async function carregarProdutos() {
            try {
                const response = await fetch('/api/produtos');
                if (!response.ok) throw new Error('Falha ao consultar API');
                catalogo = await response.json();
            } catch (error) {
                console.warn('API não disponível, usando fallback local:', error);
                catalogo = JSON.parse(localStorage.getItem('produtos_banco_mock')) || [
                    { id: 1, nome: "Picolé de Kiwi", categoria: "picoles", preco: 6.00, descricao: "100% fruta natural", disponivel: true },
                    { id: 2, nome: "Gelado Morango", categoria: "gelados", preco: 14.00, descricao: "Copo artesanal 300ml", disponivel: true },
                    { id: 3, nome: "Açaí Tradicional", categoria: "acai", preco: 22.00, descricao: "Tigela 500ml + granola", disponivel: true }
                ];
            }
            renderizarTabela();
        }

        // 2. Renderizar Tabela
        function renderizarTabela() {
            const tbody = document.getElementById('lista-admin-produtos');
            tbody.innerHTML = '';

            if (catalogo.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">Nenhum produto cadastrado.</td></tr>';
                return;
            }

            catalogo.forEach((p) => {
                const tr = document.createElement('tr');
                const estaAtivo = p.disponivel !== false;

                tr.innerHTML = `
                    <td><strong>${p.nome}</strong></td>
                    <td>${p.categoria}</td>
                    <td>R$ ${parseFloat(p.preco).toFixed(2).replace('.', ',')}</td>
                    <td>
                        <span class="badge-status ${estaAtivo ? 'status-ativo' : 'status-inativo'}">
                            ${estaAtivo ? 'Ativo' : 'Esgotado'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-acao" onclick="alternarStatus(${p.id}, ${estaAtivo})" title="Alternar Disponibilidade">🔄</button>
                        <button class="btn-acao" onclick="removerProduto(${p.id})" title="Excluir">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Cadastrar Produto (POST /api/produtos)
        document.getElementById('form-produto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-salvar');
            btn.disabled = true;
            btn.innerText = 'Salvando...';

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                categoria: document.getElementById('categoria').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem_url: document.getElementById('imagem_url').value.trim(),
                descricao: document.getElementById('descricao').value.trim()
            };

            try {
                const response = await fetch('/api/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Erro ao salvar no banco');
                
                const itemCriado = await response.json();
                catalogo.push(itemCriado);
                mostrarMensagem('Produto cadastrado no banco com sucesso!');
            } catch (err) {
                console.warn('Salvando localmente devido ao erro na API:', err);
                const itemMock = { ...payload, id: Date.now(), disponivel: true };
                catalogo.push(itemMock);
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
                mostrarMensagem('Produto cadastrado localmente!', 'sucesso');
            } finally {
                renderizarTabela();
                e.target.reset();
                btn.disabled = false;
                btn.innerText = 'Cadastrar Produto';
            }
        });

        // 4. Alternar Status (PATCH /api/produtos)
        async function alternarStatus(id, statusAtual) {
            const novoStatus = !statusAtual;

            try {
                const response = await fetch('/api/produtos', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, disponivel: novoStatus })
                });

                if (!response.ok) throw new Error('Falha ao atualizar status');
                
                const index = catalogo.findIndex(item => item.id === id);
                if (index !== -1) catalogo[index].disponivel = novoStatus;
            } catch (err) {
                console.warn('Atualizando status localmente:', err);
                const index = catalogo.findIndex(item => item.id === id);
                if (index !== -1) catalogo[index].disponivel = novoStatus;
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
            }

            renderizarTabela();
        }

        // 5. Remover Produto (DELETE /api/produtos?id=X)
        async function removerProduto(id) {
            if (!confirm('Deseja realmente remover este produto?')) return;

            try {
                const response = await fetch(`/api/produtos?id=${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Falha ao excluir produto');
                catalogo = catalogo.filter(item => item.id !== id);
                mostrarMensagem('Produto removido com sucesso!');
            } catch (err) {
                console.warn('Removendo localmente:', err);
                catalogo = catalogo.filter(item => item.id !== id);
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
                mostrarMensagem('Produto removido localmente!', 'sucesso');
            }

            renderizarTabela();
        }

        document.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
</body>
</html>
