<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão | Frutos de Goiás</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css?v=2">
    <!-- Biblioteca leve de geração de QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .grid-acoes-topo {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .btn-secundario {
            background: #181d1a;
            border: 1px solid rgba(0, 255, 102, 0.4);
            color: #00FF66;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .caixa-qr {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #141715;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 15px;
        }
        #qrcode-preview {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header class="topo-admin">
            <div class="marca-admin">
                <h1>Frutos de Goiás</h1>
                <span>Painel & Gestão de Mesas</span>
            </div>
            <a href="cardapio.html" target="_blank" class="btn-link-cardapio">Ver Cardápio ↗</a>
        </header>

        <div class="grid-acoes-topo">
            <button class="btn-secundario" onclick="abrirCardapioImpressao()">📄 Imprimir Cardápio da Loja</button>
            <button class="btn-secundario" onclick="document.getElementById('secao-qrcode').scrollIntoView({ behavior: 'smooth' })">📱 Gerar QR Code de Mesas</button>
        </div>

        <div id="alerta-feedback" class="alerta-feedback"></div>

        <!-- Seção: Gerador de QR Code de Mesas -->
        <section class="painel-secao" id="secao-qrcode">
            <h2 class="secao-titulo">Gerador de QR Code para Mesas</h2>
            <div class="grid-formulario">
                <div class="grupo-input">
                    <label>Número da Mesa</label>
                    <input type="number" id="num-mesa" value="1" min="1" max="50">
                </div>
                <div class="grupo-input">
                    <label>URL Base da Loja</label>
                    <input type="text" id="url-base-qr" placeholder="https://seudominio.com/cardapio.html">
                </div>
                <button type="button" class="btn-principal" onclick="gerarQRCodeMesa()">Gerar QR Code da Mesa</button>
            </div>

            <div id="resultado-qr" class="caixa-qr" style="display: none;">
                <h3 id="titulo-qr-mesa" style="font-size: 1.1rem; color: #00FF66;">Mesa 01</h3>
                <div id="qrcode-preview"></div>
                <p id="link-qr-mesa" style="color: #888; font-size: 0.8rem; word-break: break-all; margin-bottom: 12px;"></p>
                <button class="btn-secundario" onclick="imprimirAdesivoMesa()">🖨️ Imprimir Plaquinha da Mesa</button>
            </div>
        </section>

        <!-- Seção: Cadastrar Produto -->
        <section class="painel-secao">
            <h2 class="secao-titulo">Cadastrar Produto</h2>
            <form id="form-cadastro" class="grid-formulario">
                <div class="grupo-input">
                    <label for="codigo">Código Curto do Cardápio</label>
                    <input type="text" id="codigo" placeholder="Ex: #01 (automático se vazio)">
                </div>

                <div class="grupo-input">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: Picolé Ninho Trufado" required>
                </div>

                <div class="grupo-input">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="picoles">Picolés</option>
                        <option value="gelados">Taças & Gelados</option>
                        <option value="acai">Açaí</option>
                        <option value="especiais">Especiais</option>
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" step="0.50" id="preco" placeholder="Ex: 8.50" required>
                </div>

                <div class="grupo-input campo-full">
                    <label for="imagem_url">URL da Fotografia</label>
                    <input type="url" id="imagem_url" placeholder="https://exemplo.com/foto.jpg">
                </div>

                <div class="grupo-input campo-full">
                    <label for="descricao">Descrição / Ingredientes</label>
                    <textarea id="descricao" rows="2" placeholder="Ex: 100% fruta natural..."></textarea>
                </div>

                <button type="submit" id="btn-submit" class="btn-principal">Salvar no Catálogo</button>
            </form>
        </section>

        <!-- Seção: Lista de Itens -->
        <section class="painel-secao">
            <h2 class="secao-titulo">Itens no Banco de Dados</h2>
            <div class="lista-produtos" id="lista-produtos">
                <div class="estado-vazio">A carregar itens do catálogo...</div>
            </div>
        </section>

    </div>

    <script>
        let catalogo = [];

        // Preenche automaticamente a URL base do cardápio
        document.getElementById('url-base-qr').value = window.location.href.replace('admin.html', 'cardapio.html');

        function emitirFeedback(texto, tipo = 'sucesso') {
            const caixa = document.getElementById('alerta-feedback');
            caixa.innerText = texto;
            caixa.className = `alerta-feedback ${tipo === 'sucesso' ? 'alerta-sucesso' : 'alerta-erro'}`;
            caixa.style.display = 'block';
            setTimeout(() => { caixa.style.display = 'none'; }, 3500);
        }

        async function carregarCatalogo() {
            try {
                const res = await fetch('/api/produtos');
                if (!res.ok) throw new Error();
                catalogo = await res.json();
            } catch (err) {
                catalogo = JSON.parse(localStorage.getItem('produtos_banco_mock')) || [];
            }
            renderizarItens();
        }

        function renderizarItens() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';

            if (catalogo.length === 0) {
                container.innerHTML = '<div class="estado-vazio">Nenhum produto cadastrado no banco.</div>';
                return;
            }

            catalogo.forEach((item) => {
                const precoFormatado = parseFloat(item.preco).toFixed(2).replace('.', ',');
                const cod = item.codigo || `#${String(item.id).padStart(2, '0')}`;
                const ativo = item.disponivel !== false;

                const linha = document.createElement('div');
                linha.className = 'item-linha';
                linha.innerHTML = `
                    <div class="item-info">
                        <span class="item-nome"><strong style="color: #00FF66;">${cod}</strong> ${item.nome}</span>
                        <span class="item-sub">${item.categoria.toUpperCase()} • R$ ${precoFormatado}</span>
                    </div>
                    <div class="item-acoes">
                        <button class="badge-status ${ativo ? 'status-ativo' : 'status-esgotado'}" onclick="alternarStatus(${item.id}, ${ativo})">
                            ${ativo ? '● Disponível' : '○ Esgotado'}
                        </button>
                        <button class="btn-excluir" onclick="removerItem(${item.id})">Excluir</button>
                    </div>
                `;
                container.appendChild(linha);
            });
        }

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerText = 'A guardar...';

            const payload = {
                codigo: document.getElementById('codigo').value.trim() || undefined,
                nome: document.getElementById('nome').value.trim(),
                categoria: document.getElementById('categoria').value,
                preco: parseFloat(document.getElementById('preco').value),
                imagem_url: document.getElementById('imagem_url').value.trim(),
                descricao: document.getElementById('descricao').value.trim()
            };

            try {
                const res = await fetch('/api/produtos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error();
                const novo = await res.json();
                catalogo.push(novo);
                emitirFeedback('Produto adicionado ao banco com sucesso!');
            } catch (err) {
                const novoMock = { ...payload, id: Date.now(), codigo: payload.codigo || `#${catalogo.length + 1}`, disponivel: true };
                catalogo.push(novoMock);
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
                emitirFeedback('Produto guardado localmente!', 'sucesso');
            } finally {
                renderizarItens();
                e.target.reset();
                btn.disabled = false;
                btn.innerText = 'Salvar no Catálogo';
            }
        });

        async function alternarStatus(id, statusAtual) {
            const novoStatus = !statusAtual;
            try {
                const res = await fetch('/api/produtos', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, disponivel: novoStatus })
                });
                if (!res.ok) throw new Error();
                const index = catalogo.findIndex(p => p.id === id);
                if (index !== -1) catalogo[index].disponivel = novoStatus;
            } catch (e) {
                const index = catalogo.findIndex(p => p.id === id);
                if (index !== -1) catalogo[index].disponivel = novoStatus;
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
            }
            renderizarItens();
        }

        async function removerItem(id) {
            if (!confirm('Deseja excluir este item do catálogo?')) return;
            try {
                const res = await fetch(`/api/produtos?id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                catalogo = catalogo.filter(p => p.id !== id);
                emitirFeedback('Item removido com sucesso!');
            } catch (e) {
                catalogo = catalogo.filter(p => p.id !== id);
                localStorage.setItem('produtos_banco_mock', JSON.stringify(catalogo));
                emitirFeedback('Item removido localmente!', 'sucesso');
            }
            renderizarItens();
        }

        // ================= GERADOR DE QR CODE =================
        let qrcodeObj = null;
        function gerarQRCodeMesa() {
            const num = document.getElementById('num-mesa').value.padStart(2, '0');
            const baseUrl = document.getElementById('url-base-qr').value.trim();
            const urlFinal = `${baseUrl}?mesa=${num}`;

            document.getElementById('resultado-qr').style.display = 'flex';
            document.getElementById('titulo-qr-mesa').innerText = `Mesa ${num}`;
            document.getElementById('link-qr-mesa').innerText = urlFinal;

            const qrContainer = document.getElementById('qrcode-preview');
            qrContainer.innerHTML = '';
            qrcodeObj = new QRCode(qrContainer, {
                text: urlFinal,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function imprimirAdesivoMesa() {
            const num = document.getElementById('num-mesa').value.padStart(2, '0');
            const qrImg = document.querySelector('#qrcode-preview img').src;
            const janela = window.open('', '_blank');
            janela.document.write(`
                <html>
                <head>
                    <title>Mesa ${num} - Frutos de Goiás</title>
                    <style>
                        body { font-family: sans-serif; text-align: center; padding: 40px; }
                        .adesivo { border: 2px dashed #333; padding: 30px; display: inline-block; border-radius: 16px; }
                        h1 { margin: 0; font-size: 24px; }
                        h2 { color: #00AA44; margin: 10px 0 20px; font-size: 32px; }
                        p { font-size: 14px; color: #666; margin-top: 15px; }
                    </style>
                </head>
                <body>
                    <div class="adesivo">
                        <h1>FRUTOS DE GOIÁS</h1>
                        <h2>MESA ${num}</h2>
                        <img src="${qrImg}" width="220" />
                        <p>Aponte a câmara do telemóvel<br>para abrir o cardápio e pedir</p>
                    </div>
                    <script>window.onload = function() { window.print(); window.close(); }<\/script>
                </body>
                </html>
            `);
        }

        // ================= IMPRESSÃO DO CARDÁPIO FÍSICO COM CÓDIGOS =================
        function abrirCardapioImpressao() {
            const categorias = {
                'picoles': 'Picolés Artesanais',
                'gelados': 'Taças & Gelados',
                'acai': 'Açaí Natural',
                'especiais': 'Especiais da Casa'
            };

            let conteudoHTML = '';
            for (const [slug, nomeCat] of Object.entries(categorias)) {
                const itens = catalogo.filter(p => p.categoria === slug && p.disponivel !== false);
                if (itens.length === 0) continue;

                conteudoHTML += `<div class="categoria-bloco"><h3>${nomeCat}</h3><div class="lista-itens">`;
                itens.forEach(item => {
                    const cod = item.codigo || `#${String(item.id).padStart(2, '0')}`;
                    const preco = parseFloat(item.preco).toFixed(2).replace('.', ',');
                    conteudoHTML += `
                        <div class="linha-item">
                            <div class="esquerda">
                                <span class="cod">${cod}</span>
                                <div class="detalhes">
                                    <span class="nome">${item.nome}</span>
                                    <span class="desc">${item.descricao || ''}</span>
                                </div>
                            </div>
                            <span class="pontilhado"></span>
                            <span class="preco">R$ ${preco}</span>
                        </div>
                    `;
                });
                conteudoHTML += `</div></div>`;
            }

            const janela = window.open('', '_blank');
            janela.document.write(`
                <html>
                <head>
                    <title>Cardápio de Mesa - Frutos de Goiás</title>
                    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
                    <style>
                        @page { size: A4; margin: 15mm; }
                        body { font-family: 'Plus Jakarta Sans', sans-serif; color: #111; margin: 0; padding: 10px; }
                        .cabecalho { text-align: center; border-bottom: 2px solid #111; padding-bottom: 15px; margin-bottom: 20px; }
                        .cabecalho h1 { font-family: 'Playfair Display', serif; font-size: 30px; margin: 0; }
                        .cabecalho p { margin: 6px 0 0; font-size: 13px; color: #555; letter-spacing: 1px; }
                        .dica-codigo { background: #f4f4f4; border-radius: 8px; padding: 8px; font-size: 11px; text-align: center; margin-bottom: 20px; border: 1px dashed #ccc; }
                        .grid-cardapio { column-count: 2; column-gap: 30px; }
                        .categoria-bloco { break-inside: avoid; margin-bottom: 25px; }
                        .categoria-bloco h3 { font-family: 'Playfair Display', serif; font-size: 18px; margin: 0 0 10px; border-bottom: 1px solid #ddd; padding-bottom: 4px; color: #008833; }
                        .linha-item { display: flex; align-items: baseline; margin-bottom: 10px; break-inside: avoid; }
                        .esquerda { display: flex; align-items: baseline; gap: 8px; max-width: 70%; }
                        .cod { font-weight: 700; color: #008833; font-size: 13px; font-family: monospace; }
                        .nome { font-weight: 600; font-size: 13px; }
                        .desc { display: block; font-size: 10px; color: #666; margin-top: 2px; }
                        .pontilhado { flex-grow: 1; border-bottom: 1px dotted #aaa; margin: 0 8px; }
                        .preco { font-weight: 700; font-size: 13px; white-space: nowrap; }
                    </style>
                </head>
                <body>
                    <div class="cabecalho">
                        <h1>FRUTOS DE GOIÁS</h1>
                        <p>CARDÁPIO ARTESANAL</p>
                    </div>
                    <div class="dica-codigo">
                        💡 <strong>Atendimento Express:</strong> Veja o código verde (ex: <strong>#01</strong>) ao lado do produto, abra a câmara no QR Code da mesa e digite o código na busca para pedir instantaneamente!
                    </div>
                    <div class="grid-cardapio">
                        ${conteudoHTML}
                    </div>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>
            `);
        }

        document.addEventListener('DOMContentLoaded', carregarCatalogo);
    </script>
</body>
</html>
