<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Frutos de Goiás | Cardápio Artesanal</title>
    <!-- Tipografia refinada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-principal: #0F1110;
            --bg-cartao: #181A19;
            --destaque-dourado: #E5B369;
            --texto-principal: #FFFFFF;
            --texto-suave: #9E9E9E;
            --borda-fina: rgba(255, 255, 255, 0.08);
            --verde-sucesso: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 120px;
        }

        /* Topo Minimalista */
        .topo-marca {
            padding: 24px 20px 16px;
            text-align: center;
            border-bottom: 1px solid var(--borda-fina);
        }

        .nome-marca {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: var(--texto-principal);
        }

        .selo-mesa {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--destaque-dourado);
            background: rgba(229, 179, 105, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Categorias em Pílulas Suaves */
        .categorias-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 16px 20px;
            scrollbar-width: none;
        }
        .categorias-scroll::-webkit-scrollbar { display: none; }

        .btn-categoria {
            background: transparent;
            border: 1px solid var(--borda-fina);
            color: var(--texto-suave);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-categoria.ativo {
            background: var(--destaque-dourado);
            color: #111;
            border-color: var(--destaque-dourado);
            font-weight: 600;
        }

        /* Grelha de Vitrine */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            padding: 0 20px;
        }

        .card-produto {
            background: var(--bg-cartao);
            border: 1px solid var(--borda-fina);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease;
        }

        .card-produto:active {
            transform: scale(0.98);
        }

        .imagem-container {
            width: 100%;
            height: 140px;
            background: #202422;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .imagem-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .imagem-fallback {
            font-size: 2.2rem;
            opacity: 0.4;
        }

        .info-produto {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .titulo-produto {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.25;
        }

        .descricao-produto {
            font-size: 0.75rem;
            color: var(--texto-suave);
            margin-bottom: 12px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .rodape-produto {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .preco-produto {
            font-size: 1rem;
            font-weight: 700;
            color: var(--destaque-dourado);
        }

        .btn-adicionar {
            background: rgba(229, 179, 105, 0.15);
            color: var(--destaque-dourado);
            border: 1px solid rgba(229, 179, 105, 0.3);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-adicionar:active {
            background: var(--destaque-dourado);
            color: #111;
        }

        /* Barra Flutuante de Pedido (Checkout Minimalista) */
        .barra-pedido {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1D201E;
            border: 1px solid rgba(229, 179, 105, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 12px 18px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .resumo-pedido {
            display: flex;
            flex-direction: column;
        }

        .resumo-itens {
            font-size: 0.8rem;
            color: var(--texto-suave);
        }

        .resumo-valor {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--texto-principal);
        }

        .btn-concluir {
            background: var(--verde-sucesso);
            color: #FFF;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="topo-marca">
        <h1 class="nome-marca">Frutos de Goiás</h1>
        <span id="rotulo-mesa" class="selo-mesa">Mesa 01</span>
    </header>

    <nav class="categorias-scroll">
        <button class="btn-categoria ativo" onclick="selecionarCategoria('todos')">Todos</button>
        <button class="btn-categoria" onclick="selecionarCategoria('picoles')">Picolés</button>
        <button class="btn-categoria" onclick="selecionarCategoria('gelados')">Taças & Gelados</button>
        <button class="btn-categoria" onclick="selecionarCategoria('acai')">Açaí</button>
    </nav>

    <main class="vitrine" id="grid-vitrine">
        <!-- Renderizado dinamicamente -->
    </main>

    <!-- Barra que surge quando há itens no pedido -->
    <div id="barra-pedido" class="barra-pedido">
        <div class="resumo-pedido">
            <span id="total-itens" class="resumo-itens">0 itens selecionados</span>
            <span id="total-valor" class="resumo-valor">R$ 0,00</span>
        </div>
        <button class="btn-concluir" onclick="finalizarWhatsApp()">Pedir via WhatsApp</button>
    </div>

    <script>
        // 1. Identificar Mesa pela URL (?mesa=03)
        const params = new URLSearchParams(window.location.search);
        const paramMesa = params.get('mesa');
        if (paramMesa) {
            localStorage.setItem('mesa_ativa', `Mesa ${paramMesa}`);
        }
        const mesa = localStorage.getItem('mesa_ativa') || 'Balcão';
        document.getElementById('rotulo-mesa').innerText = mesa;

        // 2. Estado de Produtos e Pedido
        let produtos = [];
        let pedido = {};

        async function carregarProdutos() {
            try {
                const res = await fetch('/api/produtos');
                if (!res.ok) throw new Error();
                produtos = await res.json();
            } catch (e) {
                // Catálogo base de fallback com fotos de exemplo apetitosas
                produtos = [
                    { id: 1, nome: "Picolé Ninho Trufado", categoria: "picoles", preco: 8.50, descricao: "Cremoso com recheio de creme de avelã", imagem_url: "https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=400&q=80" },
                    { id: 2, nome: "Picolé de Maracujá", categoria: "picoles", preco: 6.00, descricao: "100% polpa de fruta natural", imagem_url: "https://images.unsplash.com/photo-1488900128323-21503983a07e?w=400&q=80" },
                    { id: 3, nome: "Taça Suprema de Morango", categoria: "gelados", preco: 24.00, descricao: "Gelado artesanal, morangos e raspas de chocolate", imagem_url: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400&q=80" },
                    { id: 4, nome: "Tigela Açaí Puro 500ml", categoria: "acai", preco: 22.00, descricao: "Batido na consistência ideal com granola artesanal", imagem_url: "https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?w=400&q=80" }
                ];
            }
            renderizarVitrine(produtos);
        }

        function renderizarVitrine(lista) {
            const grid = document.getElementById('grid-vitrine');
            grid.innerHTML = '';

            lista.forEach(item => {
                const precoFormatado = parseFloat(item.preco).toFixed(2).replace('.', ',');
                const card = document.createElement('div');
                card.className = 'card-produto';
                card.innerHTML = `
                    <div class="imagem-container">
                        ${item.imagem_url ? `<img src="${item.imagem_url}" alt="${item.nome}" loading="lazy">` : `<span class="imagem-fallback">🍨</span>`}
                    </div>
                    <div class="info-produto">
                        <h2 class="titulo-produto">${item.nome}</h2>
                        <p class="descricao-produto">${item.descricao || ''}</p>
                        <div class="rodape-produto">
                            <span class="preco-produto">R$ ${precoFormatado}</span>
                            <button class="btn-adicionar" onclick="adicionar(${item.id})">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selecionarCategoria(cat) {
            document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('ativo'));
            event.target.classList.add('ativo');

            if (cat === 'todos') {
                renderizarVitrine(produtos);
            } else {
                renderizarVitrine(produtos.filter(p => p.categoria.toLowerCase() === cat.toLowerCase()));
            }
        }

        function adicionar(id) {
            const item = produtos.find(p => p.id === id);
            if (!item) return;

            if (pedido[id]) {
                pedido[id].qtd += 1;
            } else {
                pedido[id] = { nome: item.nome, preco: parseFloat(item.preco), qtd: 1 };
            }
            atualizarBarraPedido();
        }

        function atualizarBarraPedido() {
            const barra = document.getElementById('barra-pedido');
            const totalItensElem = document.getElementById('total-itens');
            const totalValorElem = document.getElementById('total-valor');

            let qtdTotal = 0;
            let valorTotal = 0;

            Object.values(pedido).forEach(item => {
                qtdTotal += item.qtd;
                valorTotal += (item.preco * item.qtd);
            });

            if (qtdTotal > 0) {
                barra.style.display = 'flex';
                totalItensElem.innerText = `${qtdTotal} ${qtdTotal === 1 ? 'item' : 'itens'} selecionado${qtdTotal === 1 ? '' : 's'}`;
                totalValorElem.innerText = `R$ ${valorTotal.toFixed(2).replace('.', ',')}`;
            } else {
                barra.style.display = 'none';
            }
        }

        function finalizarWhatsApp() {
            let msg = `Olá! Gostaria de fazer o seguinte pedido:%0A`;
            msg += `📍 *${mesa}*%0A%0A`;

            let valorTotal = 0;
            Object.values(pedido).forEach(item => {
                const sub = (item.preco * item.qtd).toFixed(2).replace('.', ',');
                msg += `• ${item.qtd}x ${item.nome} (R$ ${sub})%0A`;
                valorTotal += (item.preco * item.qtd);
            });

            msg += `%0A*Total: R$ ${valorTotal.toFixed(2).replace('.', ',')}*`;

            const numeroWhatsApp = "5589999999999"; // Ajustar para o número do estabelecimento
            window.open(`https://wa.me/${numeroWhatsApp}?text=${msg}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', carregarProdutos);
    </script>
</body>
</html>
