<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutos de Goiás | Meu Carrinho</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Liga ao CSS do Cardápio/App -->
    <link rel="stylesheet" href="css/app.css?v=2">
</head>

<body>

    <!-- CABEÇALHO PREMIUM -->
    <header class="app-header">
        <div class="logo-container">
            <h1 class="logo-texto">MEU CARRINHO</h1>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL DO CARRINHO -->
    <main class="app-conteudo">
        
        <!-- Estado Vazio (ou lista de produtos adicionados dinamicamente) -->
        <div id="carrinho-vazio" class="carrinho-vazio-container">
            <div class="icone-vazio">🛒</div>
            <p class="texto-vazio">O teu carrinho está vazio.</p>
            <a href="app.html" class="btn-explorar-cardapio">Ver Cardápio</a>
        </div>

        <!-- Secção de Resumo (Aparece quando houver itens) -->
        <div id="carrinho-conteudo" style="display: none;">
            <div class="lista-itens-carrinho" id="lista-carrinho">
                <!-- Os produtos adicionados entram aqui via JavaScript futuramente -->
            </div>

            <div class="caixa-resumo">
                <div class="linha-total">
                    <span>Total:</span>
                    <span id="preco-total" class="verde">R$ 0,00</span>
                </div>
                <button class="botao-neon btn-finalizar" onclick="finalizarPedidoWhatsApp()">FINALIZAR PEDIDO</button>
            </div>
        </div>

    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-bar">
        <a href="app.html" class="nav-item">
            <span class="icone">🏠</span>
            <span>Início</span>
        </a>
        <a href="app.html" class="nav-item">
            <span class="icone">📜</span>
            <span>Cardápio</span>
        </a>
        <a href="leitor.html" class="nav-item">
            <span class="icone">📷</span>
            <span>Ler QR</span>
        </a>
        <a href="carrinho.html" class="nav-item ativo">
            <span class="icone">🛒</span>
            <span>Carrinho</span>
        </a>
    </nav>

    <!-- Estilos específicos para o Carrinho integrados -->
    <style>
        .carrinho-vazio-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }
        .icone-vazio {
            font-size: 4rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .texto-vazio {
            font-size: 1rem;
            color: var(--cor-texto-sec);
            margin-bottom: 25px;
        }
        .btn-explorar-cardapio {
            background-color: var(--cor-verde);
            color: #000;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 255, 102, 0.3);
        }
        .caixa-resumo {
            margin-top: 30px;
            background-color: var(--cor-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
        }
        .linha-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.3rem;
            font-family: 'Anton', sans-serif;
            margin-bottom: 20px;
        }
        .btn-finalizar {
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            display: block;
        }
    </style>

   <!-- Script completo para gerir e exibir o Carrinho -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarCarrinho();
        });

        function carregarCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem('carrinho_frutos')) || [];
            const containerVazio = document.getElementById('carrinho-vazio');
            const containerConteudo = document.getElementById('carrinho-conteudo');
            const listaCarrinho = document.getElementById('lista-carrinho');
            const precoTotalElem = document.getElementById('preco-total');

            if (carrinho.length === 0) {
                containerVazio.style.display = 'flex';
                containerConteudo.style.display = 'none';
                return;
            }

            // Mostra o conteúdo e esconde o estado vazio
            containerVazio.style.display = 'none';
            containerConteudo.style.display = 'block';

            listaCarrinho.innerHTML = '';
            let total = 0;

            carrinho.forEach((item, index) => {
                // Converte o preço string (ex: "R$ 6,00") para número float (6.00)
                let precoNumerico = parseFloat(item.preco.replace('R$', '').replace(',', '.').trim()) || 0;
                total += precoNumerico;

                const itemDiv = document.createElement('div');
                itemDiv.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);";
                
                itemDiv.innerHTML = `
                    <div>
                        <h4 style="margin: 0; font-size: 0.95rem; color: #FFF;">${item.titulo}</h4>
                        <span style="font-size: 0.85rem; color: var(--cor-verde);">${item.preco}</span>
                    </div>
                    <button onclick="removerItem(${index})" style="background: none; border: none; color: #ff4444; font-size: 1.1rem; cursor: pointer;">🗑️</button>
                `;
                listaCarrinho.appendChild(itemDiv);
            });

            precoTotalElem.innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        function removerItem(index) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho_frutos')) || [];
            carrinho.splice(index, 1);
            localStorage.setItem('carrinho_frutos', JSON.stringify(carrinho));
            carregarCarrinho(); // Atualiza a tela
        }

        function finalizarPedidoWhatsApp() {
            const carrinho = JSON.parse(localStorage.getItem('carrinho_frutos')) || [];
            if (carrinho.length === 0) return;

            let mensagem = "Olá! Gostaria de fazer o seguinte pedido:%0A";
            let total = 0;

            carrinho.forEach(item => {
                mensagem += `- ${item.titulo} (${item.preco})%0A`;
                let precoNum = parseFloat(item.preco.replace('R$', '').replace(',', '.').trim()) || 0;
                total += precoNum;
            });

            mensagem += `%0A*Total:* R$ ${total.toFixed(2).replace('.', ',')}`;

            // Substitui pelo número de WhatsApp real do estabelecimento (ex: 5561999999999)
            const numeroWhatsApp = "5500999999999"; 
            const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${mensagem}`;

            window.open(urlWhatsApp, '_blank');
        }
    </script>
</body>

</html>
