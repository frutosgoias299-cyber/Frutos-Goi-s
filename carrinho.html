<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutos de Goiás | Carrinho de Compras</title>
    <!-- Fontes do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Liga ao CSS do Cardápio -->
    <link rel="stylesheet" href="css/app.css?v=2">
    <style>
        /* Estilos específicos para a página do carrinho */
        .carrinho-container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 100px; /* Espaço para a barra inferior */
        }
        
        .lista-itens {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .item-carrinho {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-detalhes h4 {
            color: #FFF;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .item-detalhes p {
            color: var(--cor-verde);
            font-weight: bold;
            font-size: 0.95rem;
        }

        .btn-remover {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-remover:hover {
            background: rgba(255, 68, 68, 0.4);
        }

        .carrinho-vazio {
            text-align: center;
            color: #aaa;
            margin-top: 50px;
            font-size: 1.1rem;
        }

        .resumo-caixa {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .resumo-linha {
            display: flex;
            justify-content: space-between;
            color: #FFF;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .resumo-linha.total {
            font-size: 1.3rem;
            font-weight: bold;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            color: var(--cor-verde);
        }

        .btn-whatsapp {
            display: block;
            width: 100%;
            background-color: #25D366;
            color: #FFF;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: background 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO PREMIUM -->
    <header class="app-header">
        <div class="logo-container">
            <h1 class="logo-texto">SEU CARRINHO</h1>
        </div>
        <div class="badge-delivery">
            <span>🛒 Pedido</span>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="app-conteudo">
        <div class="carrinho-container">
            
            <!-- Lista dinâmica de produtos -->
            <div id="lista-carrinho" class="lista-itens">
                <!-- Os itens serão injetados aqui via JavaScript -->
            </div>

            <!-- Caixa de Resumo e Checkout -->
            <div id="caixa-resumo" class="resumo-caixa" style="display: none;">
                <div class="resumo-linha total">
                    <span>Total:</span>
                    <span id="preco-total">R$ 0,00</span>
                </div>
                <button id="btn-finalizar" class="btn-whatsapp">Finalizar Pedido via WhatsApp 🚀</button>
            </div>

        </div>
    </main>

    <!-- BARRA DE NAVEGAÇÃO INFERIOR ESTILO APP NATIVA -->
    <nav class="bottom-bar">
        <a href="app.html" class="nav-item">
            <span class="icone">🏠</span>
            <span>Início</span>
        </a>
        <a href="app.html" class="nav-item">
            <span class="icone">📜</span>
            <span>Cardápio</span>
        </a>
        <a href="leitor.html" class="nav-item">
            <span class="icone">📷</span>
            <span>Ler QR</span>
        </a>
        <a href="carrinho.html" class="nav-item ativo" style="position: relative;">
            <span class="icone">🛒</span>
            <span>Carrinho</span>
            <span id="contador-carrinho" style="display: none; position: absolute; top: 2px; right: 18px; background-color: #ff4444; color: #FFF; font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 50px; min-width: 14px; text-align: center;">0</span>
        </a>
    </nav>

    <!-- Script de Gestão do Carrinho -->
    <script>
        function carregarCarrinho() {
            const listaElem = document.getElementById('lista-carrinho');
            const resumoElem = document.getElementById('caixa-resumo');
            const precoTotalElem = document.getElementById('preco-total');
            const contadorElem = document.getElementById('contador-carrinho');
            
            let carrinho = JSON.parse(localStorage.getItem('carrinho_frutos')) || [];

            // Atualiza contador da barra inferior
            if (carrinho.length > 0) {
                contadorElem.style.display = 'inline-block';
                contadorElem.innerText = carrinho.length;
                resumoElem.style.display = 'block';
            } else {
                contadorElem.style.display = 'none';
                resumoElem.style.display = 'none';
                listaElem.innerHTML = `<div class="carrinho-vazio">O seu carrinho está vazio. 🍦<br><br><a href="app.html" style="color: var(--cor-verde); text-decoration: underline;">Voltar ao Cardápio</a></div>`;
                return;
            }

            // Renderiza os produtos
            let html = '';
            let totalGeral = 0;

            carrinho.forEach((produto, index) => {
                // Converte o preço string "R$ 6,00" para número (6.00)
                let precoNumerico = parseFloat(produto.preco.replace('R$', '').replace(',', '.').trim()) || 0;
                totalGeral += precoNumerico;

                html += `
                    <div class="item-carrinho">
                        <div class="item-detalhes">
                            <h4>${produto.titulo}</h4>
                            <p>${produto.preco}</p>
                        </div>
                        <button class="btn-remover" onclick="removerItem(${index})">Remover</button>
                    </div>
                `;
            });

            listaElem.innerHTML = html;
            precoTotalElem.innerText = `R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
        }

        function removerItem(index) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho_frutos')) || [];
            carrinho.splice(index, 1);
            localStorage.setItem('carrinho_frutos', JSON.stringify(carrinho));
            carregarCarrinho();
        }

        // Finalizar pedido enviando para o WhatsApp
        document.getElementById('btn-finalizar').addEventListener('click', () => {
            let carrinho = JSON.parse(localStorage.getItem('carrinho_frutos')) || [];
            if (carrinho.length === 0) return;

            let mensagem = "Olá! Gostaria de fazer o seguinte pedido:%0A%0A";
            let totalGeral = 0;

            carrinho.forEach((item) => {
                mensagem += `- ${item.titulo} (${item.preco})%0A`;
                let precoNum = parseFloat(item.preco.replace('R$', '').replace(',', '.').trim()) || 0;
                totalGeral += precoNum;
            });

            mensagem += `%0A*Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}*`;

            // Substitui pelo número de WhatsApp do estabelecimento (exemplo)
            const numeroWhatsApp = "5589999999999"; 
            const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${mensagem}`;

            window.open(urlWhatsApp, '_blank');
        });

        // Executa ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            carregarCarrinho();
        });
    </script>
</body>

</html>
